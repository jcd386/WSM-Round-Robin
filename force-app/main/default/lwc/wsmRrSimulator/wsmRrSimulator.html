<template>
    <section class="slds-modal slds-fade-in-open slds-modal_medium" role="dialog">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                </button>
                <h2 class="slds-modal__title">Test assignment: {groupName}</h2>
                <p class="slds-text-body_small sim__subtitle">Dry-run the algorithm without affecting real records.</p>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <template lwc:if={hasWarnings}>
                    <div class="sim__warnings">
                        <template for:each={warningRows} for:item="w">
                            <p key={w.key} class="sim__warningline">
                                <lightning-icon icon-name="utility:warning" size="x-small" variant="warning" class="sim__warningicon" title="Warning"></lightning-icon>
                                <span>{w.text}</span>
                            </p>
                        </template>
                    </div>
                </template>

                <div class="sim__controls">
                    <lightning-input
                        type="checkbox"
                        label="Commit this assignment (advances the rotation)"
                        checked={commit}
                        onchange={handleCommitToggle}
                    ></lightning-input>
                    <button class="slds-button slds-button_brand" disabled={isRunning} onclick={handleRun}>
                        {runLabel}
                    </button>
                </div>

                <template lwc:if={hasResult}>
                    <div class={resultCardClass}>
                        <lightning-icon icon-name={resultIcon} variant={resultVariant} size="small" class="sim__resulticon"></lightning-icon>
                        <div>
                            <p class="sim__resulttitle">{resultTitle}</p>
                            <template lwc:if={resultDetail}>
                                <p class="sim__resultdetail">{resultDetail}</p>
                            </template>
                            <template lwc:if={committedLogId}>
                                <p class="sim__committed">Committed, see <a href={committedLogUrl}>Log {committedLogId}</a></p>
                            </template>
                            <template lwc:if={showAssignedFromTier}>
                                <p class="sim__filledtier">{assignedFromTierLabel}</p>
                            </template>
                        </div>
                    </div>

                    <table class="sim__table">
                        <thead>
                            <tr>
                                <th>Member</th>
                                <th class="sim__col-tier">Tier</th>
                                <th class="sim__col-elig">Eligible</th>
                                <th>Reason</th>
                                <template lwc:if={showExternalLoadColumn}>
                                    <th class="sim__col-load">Load</th>
                                </template>
                                <th>Capacity</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={verdictRows} for:item="v">
                                <tr key={v.memberId} class={v.rowClass}>
                                    <td>{v.userName}</td>
                                    <td class="sim__col-tier">{v.tier}</td>
                                    <td class="sim__col-elig">
                                        <lightning-icon icon-name={v.icon} variant={v.variant} size="x-small"></lightning-icon>
                                    </td>
                                    <td class="slds-text-color_weak">{v.reasonText}</td>
                                    <template lwc:if={showExternalLoadColumn}>
                                        <td class="sim__col-load">{v.externalLoadLabel}</td>
                                    </template>
                                    <td class="sim__col-capacity">
                                        <template lwc:if={v.hasCapacity}>
                                            <template for:each={v.capacityChips} for:item="chip">
                                                <span key={chip.key} class={chip.cls}>{chip.text}</span>
                                            </template>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template lwc:if={hasNoResult}>
                    <p class="slds-text-color_weak sim__empty">Click Run to preview who would be assigned next.</p>
                </template>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
