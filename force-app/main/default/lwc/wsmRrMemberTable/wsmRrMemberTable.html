<template>
    <div class="mt">
        <div class="mt__addrow">
            <div class="mt__addpicker">
                <c-wsm-rr-user-picker
                    multi
                    group-id={groupId}
                    placeholder="Search users to add…"
                    onchipschange={handleChipsChange}
                ></c-wsm-rr-user-picker>
            </div>
            <button class="slds-button slds-button_brand mt__addbtn" disabled={isAddDisabled} onclick={handleAdd}>
                Add {addCountLabel}
            </button>
        </div>

        <template lwc:if={hasRows}>
            <table class="mt__table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th class="mt__col-narrow">Active
                            <lightning-helptext class="mt__th-help" content="On means this person gets assignments. Off means they're skipped, but they keep their spot in the group."></lightning-helptext>
                        </th>
                        <th class="mt__col-narrow">Tier
                            <lightning-helptext class="mt__th-help" content="Tier 1 is the primary pool and gets assignments first. Higher tiers are only used when every lower tier is unavailable, like a bench."></lightning-helptext>
                        </th>
                        <template lwc:if={showWeight}>
                            <th class="mt__col-narrow">Weight
                                <lightning-helptext class="mt__th-help" content="Bigger number = more turns. Someone with weight 3 gets three assignments for every one that a weight-1 person gets."></lightning-helptext>
                            </th>
                        </template>
                        <template lwc:if={showCapacity}>
                            <th class="mt__col-narrow">{capHeader}
                                <lightning-helptext class="mt__th-help" content="The most this person can get per period. Blank means they use the group default. 0 means they never get assigned."></lightning-helptext>
                            </th>
                        </template>
                        <th class="mt__col-num">{usedHeader}
                            <lightning-helptext class="mt__th-help" content="How many assignments this person has received so far this period."></lightning-helptext>
                        </th>
                        <th class="mt__col-ooo">Out of office
                            <lightning-helptext class="mt__th-help" content="Away dates. The person is skipped starting on the first day and starts getting work again on the return day — with no pile-up waiting for them."></lightning-helptext>
                        </th>
                        <template lwc:if={showOrder}>
                            <th class="mt__col-order">Order
                                <lightning-helptext class="mt__th-help" content="The turn order. When two people are equally due, the one higher in this list goes first."></lightning-helptext>
                            </th>
                        </template>
                        <th class="mt__col-narrow"></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <template lwc:if={row.showTierDivider}>
                            <tr key={row.tierDividerKey} class="mt__tierdivider">
                                <td colspan="12">{row.tierDividerLabel}</td>
                            </tr>
                        </template>
                        <tr key={row.memberId} class={row.rowClass}>
                            <td>
                                <span class="slds-truncate" title={row.userName}>{row.userName}</span>
                                <template lwc:if={row.isManager}>
                                    <span class="mt__mgrbadge" title="Group manager">MGR</span>
                                </template>
                            </td>
                            <td>
                                <lightning-input
                                    variant="label-hidden"
                                    type="toggle"
                                    label="Active"
                                    message-toggle-active=""
                                    message-toggle-inactive=""
                                    checked={row.active}
                                    data-id={row.memberId}
                                    onchange={handleActiveToggle}
                                ></lightning-input>
                            </td>
                            <td>
                                <input
                                    type="number"
                                    class="mt__mininput"
                                    min="1"
                                    value={row.tier}
                                    data-id={row.memberId}
                                    onchange={handleTierChange}
                                />
                            </td>
                            <template lwc:if={showWeight}>
                                <td>
                                    <input
                                        type="number"
                                        class="mt__mininput"
                                        min="1"
                                        max="100"
                                        value={row.weight}
                                        data-id={row.memberId}
                                        onchange={handleWeightChange}
                                    />
                                </td>
                            </template>
                            <template lwc:if={showCapacity}>
                                <td>
                                    <input
                                        type="number"
                                        class="mt__mininput mt__capinput"
                                        min="0"
                                        placeholder={row.capPlaceholder}
                                        title="Max assignments per period for this member. Blank = group default, 0 = blocked."
                                        value={row.capOverride}
                                        data-id={row.memberId}
                                        onchange={handleCapChange}
                                    />
                                </td>
                            </template>
                            <td class="mt__col-num mt__used">{row.usedLabel}</td>
                            <td class="mt__ooo-cell">
                                <button class={row.oooBtnClass} title={row.oooTitle} data-id={row.memberId} onclick={toggleOooPopover}>
                                    {row.oooLabel}
                                </button>
                                <template lwc:if={row.oooOpen}>
                                    <div class="mt__oopop">
                                        <lightning-input
                                            type="date"
                                            label="OOO start"
                                            value={oooDraftStart}
                                            onchange={handleOooStartChange}
                                        ></lightning-input>
                                        <lightning-input
                                            type="date"
                                            label="Returns"
                                            value={oooDraftReturn}
                                            onchange={handleOooReturnChange}
                                        ></lightning-input>
                                        <div class="mt__oopop-actions">
                                            <button class="slds-button slds-button_neutral" data-id={row.memberId} onclick={clearOoo}>Clear</button>
                                            <button class="slds-button slds-button_brand" data-id={row.memberId} onclick={saveOoo}>Save</button>
                                        </div>
                                    </div>
                                </template>
                            </td>
                            <template lwc:if={showOrder}>
                                <td class="mt__order-cell">
                                    <button class="slds-button slds-button_icon" title="Move up" disabled={row.isFirst} data-id={row.memberId} onclick={moveUp}>
                                        <lightning-icon icon-name="utility:up" size="xx-small"></lightning-icon>
                                    </button>
                                    <button class="slds-button slds-button_icon" title="Move down" disabled={row.isLast} data-id={row.memberId} onclick={moveDown}>
                                        <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                                    </button>
                                </td>
                            </template>
                            <td>
                                <button class="slds-button slds-button_icon" title="Remove" data-id={row.memberId} onclick={confirmRemove}>
                                    <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template lwc:if={isEmpty}>
            <div class="mt__empty slds-text-color_weak">No members yet — add someone above to get started.</div>
        </template>
    </div>

    <template lwc:if={showRemoveConfirm}>
        <section class="slds-modal slds-fade-in-open slds-modal_small" role="dialog">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 class="slds-modal__title">Remove member?</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Remove {removeTargetName} from this group? They will no longer receive new assignments.</p>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={cancelRemove}>Cancel</button>
                    <button class="slds-button slds-button_destructive" onclick={doRemove}>Remove</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
