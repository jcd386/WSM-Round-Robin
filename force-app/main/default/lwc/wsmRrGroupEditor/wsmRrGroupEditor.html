<template>
    <div class="ge">
        <div class="ge__grid">
            <div class="ge__col">
                <div class="slds-form-element">
                    <span class="slds-form-element__label">Algorithm</span>
                    <lightning-helptext
                        content="How the next person is picked. Strict Rotation: everyone takes turns in order, like going around a circle. Weighted: people with a bigger weight number get more turns. Least Assigned: whoever has received the fewest this period goes next."
                    ></lightning-helptext>
                    <div class="slds-button-group ge__btngroup" role="group">
                        <template for:each={algorithmOptions} for:item="opt">
                            <button
                                key={opt.value}
                                class={opt.buttonClass}
                                data-value={opt.value}
                                onclick={handleAlgorithmClick}
                            >{opt.label}</button>
                        </template>
                    </div>
                    <p class="slds-form-element__help ge__caption">{algorithmCaption}</p>
                </div>

                <template lwc:if={isLeastAssigned}>
                    <div class="slds-form-element slds-m-top_small">
                        <span class="slds-form-element__label">Calibration for mid-period joiners</span>
                        <lightning-helptext
                            content="What happens when someone joins partway through a period. Median: they start in the middle of the pack, so they get a fair share. None: they start at zero, so the system may pile work on them to catch them up."
                        ></lightning-helptext>
                        <div class="slds-button-group ge__btngroup" role="group">
                            <template for:each={calibrationOptions} for:item="opt">
                                <button
                                    key={opt.value}
                                    class={opt.buttonClass}
                                    data-value={opt.value}
                                    onclick={handleCalibrationClick}
                                >{opt.label}</button>
                            </template>
                        </div>
                        <p class="slds-form-element__help ge__caption">{calibrationCaption}</p>
                    </div>
                </template>

                <div class="slds-form-element slds-m-top_small">
                    <lightning-input
                        type="toggle"
                        label="Enforce a period cap"
                        field-level-help="Give each person a maximum number of assignments per period. Once someone hits their max, they're skipped until the counter starts over."
                        checked={isCapacityEnabled}
                        onchange={handleCapacityToggle}
                    ></lightning-input>
                    <p class="slds-form-element__help ge__caption">Blocks assignments once a member hits their cap for the period, until it resets.</p>
                </div>

                <template lwc:if={isCapacityEnabled}>
                    <div class="ge__pair slds-m-top_x-small">
                        <div class="slds-form-element">
                            <span class="slds-form-element__label">Period</span>
                            <lightning-helptext
                                content="How often the counters go back to zero: every day at midnight, every week on Monday, or on the 1st of every month."
                            ></lightning-helptext>
                            <div class="slds-button-group ge__btngroup" role="group">
                                <template for:each={periodOptions} for:item="opt">
                                    <button
                                        key={opt.value}
                                        class={opt.buttonClass}
                                        data-value={opt.value}
                                        onclick={handlePeriodClick}
                                    >{opt.label}</button>
                                </template>
                            </div>
                        </div>
                        <lightning-input
                            type="number"
                            label="Default member cap"
                            field-level-help="The most assignments one person can get in a period. You can give any person their own number on the Members tab, blank there means they use this default, and 0 means they never get assigned."
                            placeholder="Uncapped"
                            value={defaultMemberCap}
                            onchange={handleCapChange}
                        ></lightning-input>
                    </div>
                </template>
            </div>

            <div class="ge__col">
                <div class="slds-form-element">
                    <span class="slds-form-element__label">Fallback user or queue</span>
                    <lightning-helptext
                        content="The safety net. If every member is at their max, paused, or out of office, the assignment goes to this user or queue instead of failing. A queue only works on records queues can own, like Leads and Cases."
                    ></lightning-helptext>
                    <c-wsm-rr-fallback-picker
                        placeholder="Search users and queues…"
                        value={fallbackValue}
                        value-label={fallbackLabel}
                        onselect={handleFallbackSelect}
                        onclear={handleFallbackClear}
                    ></c-wsm-rr-fallback-picker>
                    <p class="slds-form-element__help ge__caption">Leave blank to return "No Eligible Members" and let your flow decide.</p>
                </div>

                <div class="slds-form-element slds-m-top_small">
                    <span class="slds-form-element__label">Developer name</span>
                    <lightning-helptext
                        content="The group's permanent nickname. Flows use it to find this group, and it never changes, even if you rename the group later."
                    ></lightning-helptext>
                    <template lwc:if={isSlugEditable}>
                        <lightning-input
                            variant="label-hidden"
                            value={developerName}
                            placeholder="Auto-generated from name"
                            onchange={handleDevNameChange}
                        ></lightning-input>
                    </template>
                    <template lwc:if={isSlugReadOnly}>
                        <div class="ge__devname">
                            <code class="ge__devname-code">{developerName}</code>
                            <button class="slds-button slds-button_icon" title="Copy" onclick={handleCopyDevName}>
                                <lightning-icon icon-name="utility:copy" size="x-small"></lightning-icon>
                            </button>
                        </div>
                    </template>
                    <p class="slds-form-element__help ge__caption">This is the stable key flows reference. Set once, then locked.</p>
                </div>

                <lightning-textarea
                    class="slds-m-top_small"
                    label="Description"
                    field-level-help="Notes for your team about what this group is for. Only shown here."
                    value={description}
                    onchange={handleDescriptionChange}
                ></lightning-textarea>
            </div>
        </div>

        <div class="ge__footer">
            <template lwc:if={isDirty}>
                <span class="slds-text-color_weak ge__unsaved">Unsaved changes</span>
            </template>
            <button class="slds-button slds-button_brand" disabled={isSaveDisabled} onclick={handleSave}>
                Save
            </button>
        </div>
    </div>
</template>
