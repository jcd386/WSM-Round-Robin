<template>
    <div class="slds-form-element">
        <template lwc:if={label}>
            <label class="slds-form-element__label" for="wsmrr-cb-input">
                <template lwc:if={required}><abbr class="slds-required" title="required">*</abbr></template>{label}
            </label>
        </template>
        <div class="slds-form-element__control">
            <div class={comboboxClass}>
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                    <input
                        id="wsmrr-cb-input"
                        type="text"
                        role="combobox"
                        autocomplete="off"
                        class="slds-input slds-combobox__input"
                        placeholder={placeholder}
                        value={searchTerm}
                        disabled={disabled}
                        onfocus={handleFocus}
                        oninput={handleSearch}
                        onblur={handleBlur}
                    />
                    <lightning-icon
                        icon-name="utility:search"
                        size="x-small"
                        class="slds-input__icon slds-input__icon_right"
                    ></lightning-icon>
                </div>
                <div class="slds-dropdown slds-dropdown_fluid slds-dropdown_length-7" role="listbox">
                    <ul class="slds-listbox slds-listbox_vertical">
                        <template for:each={filteredOptions} for:item="opt">
                            <li key={opt.value} class="slds-listbox__item" data-value={opt.value} onmousedown={handleSelect}>
                                <div class="slds-listbox__option slds-listbox__option_plain slds-p-around_x-small wrc__option">
                                    <span class="slds-truncate" title={opt.label}>{opt.label}</span>
                                    <template lwc:if={opt.sublabel}>
                                        <span class="wrc__sublabel">{opt.sublabel}</span>
                                    </template>
                                </div>
                            </li>
                        </template>
                        <template lwc:if={noMatches}>
                            <li class="slds-listbox__item">
                                <div class="slds-listbox__option slds-listbox__option_plain slds-p-around_x-small slds-text-color_weak">No matches</div>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</template>
