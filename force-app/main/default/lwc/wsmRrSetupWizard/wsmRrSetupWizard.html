<template>
    <template lwc:if={isModal}>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <section class={containerClass} role="dialog">
        <header class="wiz__header">
            <div class="wiz__headertext">
                <h1 class={titleClass}>{title}</h1>
                <p class={stepIndicatorClass}>{stepIndicator}</p>
            </div>
            <template lwc:if={isModal}>
                <button class="slds-button slds-button_icon wiz__close" title="Close" onclick={handleCancel}>
                    <lightning-icon icon-name="utility:close" size="small" variant={closeIconVariant}></lightning-icon>
                </button>
            </template>
        </header>

        <div class="wiz__body">
            <template lwc:if={isStep1}>
                <div class="wiz__grid">
                    <lightning-input
                        label="Group name"
                        required
                        value={basics.name}
                        onchange={handleNameChange}
                    ></lightning-input>

                    <div class="slds-form-element">
                        <span class="slds-form-element__label">Algorithm</span>
                        <lightning-helptext
                            content="How the next person is picked. Strict Rotation: everyone takes turns in order, like going around a circle. Weighted: people with a bigger weight number get more turns. Least Assigned: whoever has received the fewest this period goes next."
                        ></lightning-helptext>
                        <div class="slds-button-group wiz__btngroup" role="group">
                            <template for:each={algorithmOptions} for:item="opt">
                                <button
                                    key={opt.value}
                                    class={opt.buttonClass}
                                    data-value={opt.value}
                                    onclick={handleAlgorithmClick}
                                >{opt.label}</button>
                            </template>
                        </div>
                        <p class="slds-form-element__help wiz__caption">{algorithmCaption}</p>
                    </div>

                    <lightning-input
                        type="toggle"
                        label="Enforce a period cap"
                        field-level-help="Give each person a maximum number of assignments per period. Once someone hits their max, they're skipped until the counter starts over."
                        checked={isCapacityEnabled}
                        onchange={handleCapacityToggle}
                    ></lightning-input>

                    <template lwc:if={isCapacityEnabled}>
                        <div class="wiz__pair">
                            <div class="slds-form-element">
                                <span class="slds-form-element__label">Period</span>
                                <lightning-helptext
                                    content="How often the counters go back to zero: every day at midnight, every week on Monday, or on the 1st of every month."
                                ></lightning-helptext>
                                <div class="slds-button-group wiz__btngroup" role="group">
                                    <template for:each={periodOptions} for:item="opt">
                                        <button
                                            key={opt.value}
                                            class={opt.buttonClass}
                                            data-value={opt.value}
                                            onclick={handlePeriodClick}
                                        >{opt.label}</button>
                                    </template>
                                </div>
                            </div>
                            <lightning-input
                                type="number"
                                label="Default member cap"
                                field-level-help="The most assignments one person can get in a period. You can give any person their own number later on the Members tab. 0 means blocked."
                                placeholder="Uncapped"
                                value={basics.defaultMemberCap}
                                onchange={handleCapChange}
                            ></lightning-input>
                        </div>
                    </template>

                    <div class="slds-form-element">
                        <span class="slds-form-element__label">Fallback user or queue (optional)</span>
                        <lightning-helptext
                            content="The safety net. If every member is at their max, paused, or out of office, the assignment goes to this user or queue instead of failing. A queue only works on records queues can own, like Leads and Cases."
                        ></lightning-helptext>
                        <c-wsm-rr-fallback-picker
                            placeholder="Search users and queues…"
                            value={fallbackValue}
                            value-label={fallbackLabel}
                            onselect={handleFallbackSelect}
                            onclear={handleFallbackClear}
                        ></c-wsm-rr-fallback-picker>
                    </div>
                </div>
            </template>

            <template lwc:if={isStep2}>
                <div class="wiz__step2">
                    <c-wsm-rr-user-picker
                        multi
                        placeholder="Search users to add…"
                        onchipschange={handleChipsChange}
                    ></c-wsm-rr-user-picker>

                    <template lwc:if={hasPendingMembers}>
                        <ul class="wiz__memberlist">
                            <template for:each={pendingMembers} for:item="m">
                                <li key={m.userId} class="wiz__memberrow">
                                    <span class="slds-truncate wiz__membername">{m.name}</span>
                                    <template lwc:if={isWeighted}>
                                        <input
                                            type="number"
                                            class="wiz__weightinput"
                                            min="1"
                                            max="100"
                                            value={m.weight}
                                            data-id={m.userId}
                                            onchange={handleWeightChange}
                                        />
                                    </template>
                                    <button class="slds-button slds-button_icon" title="Remove" data-id={m.userId} onclick={handleRemoveMember}>
                                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:if={hasNoPendingMembers}>
                        <p class="slds-text-color_weak wiz__empty">No members added yet — search above.</p>
                    </template>
                </div>
            </template>

            <template lwc:if={isStep3}>
                <div class="wiz__review">
                    <dl class="wiz__summary">
                        <dt>Name</dt><dd>{basics.name}</dd>
                        <dt>Algorithm</dt><dd>{basics.algorithm} — {algorithmCaption}</dd>
                        <dt>Capacity</dt><dd>{capacitySummary}</dd>
                        <dt>Fallback</dt><dd>{fallbackSummary}</dd>
                        <dt>Members</dt><dd>{memberCountSummary}</dd>
                    </dl>
                    <lightning-input
                        type="toggle"
                        label="Activate this group"
                        field-level-help="Active groups hand out assignments. You can flip this off anytime to pause the whole group."
                        checked={activate}
                        onchange={handleActivateToggle}
                    ></lightning-input>
                    <p class="slds-form-element__help wiz__caption">You can also flip this later from the group header.</p>
                </div>
            </template>
        </div>

        <footer class="wiz__footer">
            <template lwc:if={isModal}>
                <button class="slds-button slds-button_neutral wiz__cancel" onclick={handleCancel}>Cancel</button>
            </template>
            <span class="wiz__spacer"></span>
            <button class="slds-button slds-button_neutral" disabled={isFirstStep} onclick={handleBack}>Back</button>
            <template lwc:if={isLastStep}>
                <button class="slds-button slds-button_brand" disabled={isFinishDisabled} onclick={handleFinish}>
                    {finishLabel}
                </button>
            </template>
            <template lwc:if={isNotLastStep}>
                <button class="slds-button slds-button_brand" disabled={isNextDisabled} onclick={handleNext}>Next</button>
            </template>
        </footer>
    </section>
</template>
